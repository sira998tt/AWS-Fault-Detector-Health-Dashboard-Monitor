<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Monitor Map Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #333;
            --card-bg: white;
            --sidebar-border: #ccc;
            --meta-color: #777;
            --meta-border: #eee;
            --legend-bg: rgba(255, 255, 255, 0.95);
            --input-bg: #fff;
        }

        body.dark-mode {
            --bg-color: #212529;
            --text-color: #e9ecef;
            --card-bg: #343a40;
            --sidebar-border: #495057;
            --meta-color: #adb5bd;
            --meta-border: #495057;
            --legend-bg: rgba(33, 37, 41, 0.95);
            --input-bg: #2b3035;
        }

        body.dark-mode .leaflet-layer,
        body.dark-mode .leaflet-control-zoom-in,
        body.dark-mode .leaflet-control-zoom-out,
        body.dark-mode .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        body { font-family: 'Tahoma', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; background: var(--bg-color); color: var(--text-color); transition: all 0.3s; }
        
        #map-container { flex: 7; position: relative; height: 100%; }
        #map { height: 100%; width: 100%; }
        
        .legend {
            position: absolute; bottom: 30px; left: 20px;
            background: var(--legend-bg); padding: 15px; border-radius: 8px;
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: var(--text-color);
        }
        .legend h4 { margin: 0 0 10px 0; font-size: 16px; }
        .legend p { margin: 5px 0; font-size: 14px; display: flex; align-items: center; }
        
        .color-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }
        .color-dot.green { background-color: #28a745; }
        .color-dot.yellow { background-color: #ffc107; }
        .color-dot.red { background-color: #dc3545; }
        
        .update-time { font-size: 12px; color: var(--meta-color); margin-top: 10px; border-top: 1px solid var(--meta-border); padding-top: 5px;}

        .theme-toggle {
            position: absolute; top: 20px; right: 20px;
            z-index: 1000; background: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--sidebar-border); padding: 8px 15px;
            border-radius: 20px; cursor: pointer; font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: all 0.3s;
        }
        .theme-toggle:hover { filter: brightness(0.9); }
        
        .leaflet-control-layers {
            margin-top: 60px !important; 
        }

        #sidebar { 
            flex: 3; background: var(--bg-color); border-left: 1px solid var(--sidebar-border); 
            padding: 20px; overflow-y: auto; transition: all 0.3s;
            display: flex; flex-direction: column; box-sizing: border-box;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--sidebar-border);
        }
        .sidebar-header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--text-color);
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .summary-dashboard {
            display: flex; justify-content: space-between; margin-bottom: 15px;
            gap: 8px;
        }
        .stat-card {
            background: var(--card-bg); border-radius: 8px; padding: 10px 6px;
            flex: 1; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 2px solid transparent; cursor: pointer; transition: all 0.2s;
            user-select: none;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card.active-filter { border-color: #0d6efd; box-shadow: 0 0 8px rgba(13,110,253,0.35); }
        .stat-card h5 { margin: 0 0 4px 0; font-size: 12px; color: var(--meta-color); font-weight: normal; }
        .stat-card h2 { margin: 0; font-size: 22px; font-weight: bold; }
        
        .stat-normal h2 { color: #28a745; }
        .stat-warning h2 { color: #ffc107; }
        .stat-offline h2 { color: #dc3545; }

        /* 🔍 ช่องค้นหาและปุ่มตัวกรอง */
        .search-filter-box {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        #station-search {
            width: 100%;
            padding: 9px 32px 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--sidebar-border);
            background: var(--input-bg);
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        #station-search:focus {
            border-color: #0d6efd;
        }
        .clear-search-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: var(--meta-color);
            cursor: pointer;
            font-size: 16px;
            display: none;
        }
        .filter-pills {
            display: flex;
            gap: 6px;
        }
        .filter-pill {
            flex: 1;
            padding: 5px 6px;
            font-size: 12px;
            border-radius: 15px;
            border: 1px solid var(--sidebar-border);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .filter-pill.active {
            background: #0d6efd;
            color: white;
            border-color: #0d6efd;
            font-weight: bold;
        }
        
        #sidebar h2.title { font-size: 16px; margin: 0 0 10px 0; color: var(--text-color); border-bottom: 2px solid #dc3545; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
        
        .issue-card {
            background: var(--card-bg); border-radius: 6px; padding: 10px 14px;
            margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border-left: 4px solid #dc3545; transition: all 0.2s;
            cursor: pointer;
        }
        .issue-card:hover { transform: translateY(-1px); filter: brightness(0.97); }
        .issue-card.red { border-left-color: #dc3545; }
        .issue-card.yellow { border-left-color: #ffc107; }
        .issue-card.green { border-left-color: #28a745; }
        
        body:not(.dark-mode) .issue-card.yellow h4 { color: #856404; }
        body.dark-mode .issue-card.yellow h4 { color: #ffda6a; }
        
        .issue-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--text-color);}
        .issue-card p { margin: 0 0 4px 0; font-size: 13px; color: var(--text-color); opacity: 0.85; }
        .card-metrics { font-size: 12px; color: var(--meta-color); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
        .issue-meta { font-size: 11px; color: var(--meta-color); display: block; margin-top: 5px; border-top: 1px dashed var(--meta-border); padding-top: 5px;}
        .no-issues { text-align: center; color: #28a745; margin-top: 35px; font-weight: bold; }
        
        #issue-list { flex-grow: 1; overflow-y: auto; }

        .popup-metrics {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 📱 ปรับแต่งสำหรับหน้าจอมือถือและแท็บเล็ตแนวตั้ง */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100dvh;
            }
            #map-container {
                flex: none;
                height: 52%;
                width: 100%;
            }
            #sidebar {
                flex: none;
                height: 48%;
                width: 100%;
                border-left: none;
                border-top: 2px solid var(--sidebar-border);
                padding: 10px 14px;
            }
            .sidebar-header {
                margin-bottom: 8px;
                padding-bottom: 6px;
            }
            .sidebar-header h1 {
                font-size: 17px;
            }
            .summary-dashboard {
                margin-bottom: 8px;
                gap: 5px;
            }
            .stat-card {
                padding: 5px;
            }
            .stat-card h5 {
                font-size: 11px;
            }
            .stat-card h2 {
                font-size: 17px;
            }
            .legend {
                bottom: 10px;
                left: 10px;
                padding: 8px 10px;
                max-width: 195px;
            }
            .legend h4 {
                font-size: 12px;
                margin-bottom: 4px;
            }
            .legend p {
                font-size: 11px;
                margin: 2px 0;
            }
            .update-time {
                font-size: 10px;
                margin-top: 5px;
                padding-top: 4px;
            }
            .theme-toggle {
                top: 10px;
                right: 10px;
                padding: 6px 12px;
                font-size: 12px;
            }
            .leaflet-control-layers {
                margin-top: 48px !important;
            }
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 โหมดมืด</button>
        <div class="legend">
            <h4>สถานะสถานีตรวจอากาศ</h4>
            <p><span class="color-dot green"></span> ทำงานปกติ</p>
            <p><span class="color-dot yellow"></span> เซ็นเซอร์ผิดปกติ (ค่าหาย/ค้าง/ฝนตัน)</p>
            <p><span class="color-dot red"></span> ขาดการติดต่อ (Offline)</p>
            <div class="update-time" id="last-update">กำลังเชื่อมต่อข้อมูล...</div>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Smart AWS Monitor</h1>
        </div>

        <div class="summary-dashboard">
            <div class="stat-card stat-normal" id="card-filter-green" onclick="setStatusFilter('green')" title="คลิกเพื่อกรองเฉพาะสถานีปกติ">
                <h5>🟢 ปกติ</h5>
                <h2 id="count-normal">-</h2>
            </div>
            <div class="stat-card stat-warning" id="card-filter-yellow" onclick="setStatusFilter('yellow')" title="คลิกเพื่อกรองเฉพาะสถานีเซ็นเซอร์ผิดปกติ">
                <h5>⚠️ มีปัญหา</h5>
                <h2 id="count-warning">-</h2>
            </div>
            <div class="stat-card stat-offline" id="card-filter-red" onclick="setStatusFilter('red')" title="คลิกเพื่อกรองเฉพาะสถานีออฟไลน์">
                <h5>🔴 ออฟไลน์</h5>
                <h2 id="count-offline">-</h2>
            </div>
        </div>

        <!-- 🔍 ช่องค้นหาชื่อ/รหัสสถานี และปุ่มตัวกรอง -->
        <div class="search-filter-box">
            <div class="search-input-wrap">
                <input type="text" id="station-search" placeholder="🔍 ค้นหาชื่อสถานี หรือ รหัส ID (กด Enter เพื่อซูม)..." oninput="onSearchInput()" onkeydown="onSearchKeydown(event)" />
                <button class="clear-search-btn" id="clear-search" onclick="clearSearch()" title="ล้างคำค้นหา">✕</button>
            </div>
            <div class="filter-pills">
                <button class="filter-pill active" id="pill-issues" onclick="setStatusFilter('issues')">⚠️ เฝ้าระวัง</button>
                <button class="filter-pill" id="pill-all" onclick="setStatusFilter('all')">📍 ทั้งหมด</button>
                <button class="filter-pill" id="pill-green" onclick="setStatusFilter('green')">🟢 ปกติ</button>
                <button class="filter-pill" id="pill-yellow" onclick="setStatusFilter('yellow')">🟡 เซ็นเซอร์</button>
                <button class="filter-pill" id="pill-red" onclick="setStatusFilter('red')">🔴 ออฟไลน์</button>
            </div>
        </div>
        
        <h2 class="title">
            <span id="list-heading-text">⚠️ สถานีที่ต้องเฝ้าระวัง</span>
            <small id="list-count-badge" style="font-size: 12px; color: var(--meta-color); font-weight: normal;"></small>
        </h2>
        <div id="issue-list">
            <p style="text-align: center; color: var(--meta-color);">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').innerHTML = '☀️ โหมดสว่าง';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.querySelector('.theme-toggle').innerHTML = isDark ? '☀️ โหมดสว่าง' : '🌙 โหมดมืด';
        }

        const streetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        });
        
        const satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri'
        });

        const map = L.map('map', {
            center: [8.0, 99.5],
            zoom: 7,
            layers: [streetMap]
        });

        const baseMaps = {
            "🗺️ แผนที่ปกติ": streetMap,
            "🌍 ดาวเทียม": satelliteMap
        };
        L.control.layers(baseMaps).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let stationMarkers = {};
        let allStationsData = [];
        let currentFilter = 'issues'; // 'issues', 'all', 'green', 'yellow', 'red'

        function focusStation(lat, lon, id) {
            map.flyTo([lat, lon], 11, { duration: 0.8 });
            if (stationMarkers[id]) {
                stationMarkers[id].openPopup();
            }
        }

        function setStatusFilter(filterType) {
            if (currentFilter === filterType && filterType !== 'issues') {
                currentFilter = 'issues';
            } else {
                currentFilter = filterType;
            }
            updateFilterUI();
            renderMapAndSidebar();
        }

        function updateFilterUI() {
            ['issues', 'all', 'green', 'yellow', 'red'].forEach(k => {
                const pill = document.getElementById('pill-' + k);
                if (pill) pill.classList.toggle('active', currentFilter === k);
            });
            ['green', 'yellow', 'red'].forEach(k => {
                const card = document.getElementById('card-filter-' + k);
                if (card) card.classList.toggle('active-filter', currentFilter === k);
            });

            const headingMap = {
                'issues': '⚠️ สถานีที่ต้องเฝ้าระวัง',
                'all': '📍 สถานีทั้งหมด',
                'green': '🟢 สถานีทำงานปกติ',
                'yellow': '🟡 สถานีเซ็นเซอร์ผิดปกติ',
                'red': '🔴 สถานีขาดการติดต่อ (Offline)'
            };
            document.getElementById('list-heading-text').textContent = headingMap[currentFilter] || 'รายการสถานี';
        }

        function onSearchInput() {
            const q = document.getElementById('station-search').value.trim();
            document.getElementById('clear-search').style.display = q ? 'block' : 'none';
            renderMapAndSidebar(true);
        }

        function onSearchKeydown(e) {
            if (e.key === 'Enter') {
                const matched = getFilteredStations();
                if (matched.length > 0) {
                    focusStation(matched[0].lat, matched[0].lon, matched[0].id);
                }
            }
        }

        function clearSearch() {
            document.getElementById('station-search').value = '';
            document.getElementById('clear-search').style.display = 'none';
            renderMapAndSidebar();
        }

        function formatLiveDuration(stn) {
            if (!stn.issue_start_iso) return stn.duration || '';
            const startMs = Date.parse(stn.issue_start_iso);
            if (isNaN(startMs)) return stn.duration || '';
            const diffMins = Math.max(0, Math.floor((Date.now() - startMs) / 60000));
            if (diffMins >= 1440) {
                return `${Math.floor(diffMins / 1440)} วัน ${Math.floor((diffMins % 1440) / 60)} ชม.`;
            } else if (diffMins >= 60) {
                return `${Math.floor(diffMins / 60)} ชม. ${diffMins % 60} นาที`;
            }
            return `${diffMins} นาที`;
        }

        function matchesSearchQuery(stn, q) {
            if (!q) return true;
            const idStr = String(stn.id).trim().toLowerCase();
            const nameStr = String(stn.name).toLowerCase();
            // ถ้าพิมพ์ตัวเลขล้วน ให้เช็กรหัสสถานีที่ตรงกันเป๊ะ (เช่น พิมพ์ 29 ไม่ให้ติด 3929)
            if (/^\d+$/.test(q)) {
                return idStr === q;
            }
            return nameStr.includes(q) || idStr === q;
        }

        function matchesStatusFilter(stn) {
            const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');
            if (currentFilter === 'issues') return Boolean(stn.has_error);
            if (currentFilter === 'all') return true;
            return markerColor === currentFilter;
        }

        function getFilteredStations() {
            const q = document.getElementById('station-search').value.trim().toLowerCase();
            return allStationsData.filter(stn => {
                return matchesSearchQuery(stn, q) && matchesStatusFilter(stn);
            });
        }

        function renderMapAndSidebar(autoZoomIfSingle = false) {
            markersLayer.clearLayers();
            stationMarkers = {};
            const issueListContainer = document.getElementById('issue-list');
            issueListContainer.innerHTML = "";

            const q = document.getElementById('station-search').value.trim().toLowerCase();
            const filteredList = getFilteredStations();

            // วาดหมุดบนแผนที่จาก filteredList ชุดเดียวกับ Sidebar เสมอ (หมวดเฝ้าระวังจะแสดงเฉพาะหมุดเหลืองและแดง)
            filteredList.forEach(stn => {
                const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');

                const icon = new L.Icon({
                    iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${markerColor}.png`,
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                });

                let statusText = stn.error_detail;
                if (!statusText) {
                    statusText = stn.has_error ? '⚠️ พบปัญหา' : '✅ ปกติ';
                } else if (markerColor === 'yellow') {
                    statusText = "⚠️ " + statusText.replace(/[🔴🟡🟢⚠️✅]/g, '').trim();
                } else if (markerColor === 'red') {
                    statusText = "🔴 " + statusText.replace(/[🔴🟡🟢⚠️✅]/g, '').trim();
                }

                function degToCompass(deg) {
                    if (deg === null || deg === undefined || isNaN(deg)) return '';
                    const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
                    return dirs[Math.round(((deg % 360) / 22.5)) % 16];
                }

                const tempStr = (stn.temp !== null && stn.temp !== undefined) ? `${stn.temp} °C` : '-';
                const rainStr = (stn.rain !== null && stn.rain !== undefined) ? `${stn.rain} mm` : '-';
                const rhStr = (stn.rh !== null && stn.rh !== undefined) ? `${stn.rh} %` : '-';
                const windStr = (stn.wind !== null && stn.wind !== undefined) ? `${stn.wind} knot` : '-';
                const wdirCompass = degToCompass(stn.wind_dir);
                const wdirStr = (stn.wind_dir !== null && stn.wind_dir !== undefined) ? `${stn.wind_dir}° ${wdirCompass ? '(' + wdirCompass + ')' : ''}`.trim() : '-';
                const presStr = (stn.pressure !== null && stn.pressure !== undefined) ? `${stn.pressure} hPa` : '-';
                const visLine = (stn.vis !== null && stn.vis !== undefined) ? `<br>👁 <b>ทัศนวิสัย:</b> ${stn.vis} m` : '';
                const timeStr = stn.updated_at ? `<br><small style="color:#777;">🕒 ข้อมูลเวลา: ${stn.updated_at}</small>` : '';

                const popupHTML = `
                    <b>${stn.name}</b> (ID: ${stn.id})<br>
                    สถานะ: ${statusText}
                    <div class="popup-metrics">
                        🌡 <b>อุณหภูมิ:</b> ${tempStr} &nbsp;|&nbsp; 💧 <b>ความชื้น:</b> ${rhStr}<br>
                        🌧 <b>ฝนสะสม:</b> ${rainStr} &nbsp;|&nbsp; 🧭 <b>ความกด:</b> ${presStr}<br>
                        💨 <b>ความเร็วลม:</b> ${windStr} &nbsp;|&nbsp; 🚩 <b>ทิศลม:</b> ${wdirStr}${visLine}
                        ${timeStr}
                    </div>
                `;

                const marker = L.marker([stn.lat, stn.lon], {icon: icon})
                    .bindPopup(popupHTML)
                    .addTo(markersLayer);
                stationMarkers[stn.id] = marker;
            });

            document.getElementById('list-count-badge').textContent = `(${filteredList.length} สถานี)`;

            if (filteredList.length === 0) {
                if (!q && currentFilter === 'issues') {
                    issueListContainer.innerHTML = `<div class="no-issues">✨ ทุกสถานีทำงานปกติ</div>`;
                } else {
                    issueListContainer.innerHTML = `<p style="text-align:center; color:var(--meta-color); margin-top:30px;">ไม่พบสถานีที่ตรงกับเงื่อนไข</p>`;
                }
            } else {
                filteredList.forEach(stn => {
                    const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');
                    let statusText = stn.error_detail || (stn.has_error ? '⚠️ พบปัญหา' : '✅ ปกติ');
                    const liveDur = formatLiveDuration(stn);

                    let metaHTML = "";
                    if (stn.has_error && stn.issue_time && liveDur) {
                        metaHTML = `<span class="issue-meta">⏰ เริ่มขัดข้อง: ${stn.issue_time} (ผ่านมา ${liveDur})</span>`;
                    } else if (stn.updated_at) {
                        metaHTML = `<span class="issue-meta">🕒 อัปเดตข้อมูลล่าสุด: ${stn.updated_at}</span>`;
                    }

                    const tempTag = (stn.temp !== null && stn.temp !== undefined) ? `<span>🌡 ${stn.temp}°C</span>` : '';
                    const rhTag = (stn.rh !== null && stn.rh !== undefined) ? `<span>💧 ${stn.rh}%</span>` : '';
                    const rainTag = (stn.rain !== null && stn.rain !== undefined) ? `<span>🌧 ${stn.rain} mm</span>` : '';
                    const presTag = (stn.pressure !== null && stn.pressure !== undefined) ? `<span>🧭 ${stn.pressure} hPa</span>` : '';
                    const windTag = (stn.wind !== null && stn.wind !== undefined) ? `<span>💨 ${stn.wind} kt</span>` : '';
                    const wdirTag = (stn.wind_dir !== null && stn.wind_dir !== undefined) ? `<span>🚩 ${stn.wind_dir}°</span>` : '';

                    const cardHTML = `
                        <div class="issue-card ${markerColor}" onclick="focusStation(${stn.lat}, ${stn.lon}, '${stn.id}')">
                            <h4>${stn.name} (ID: ${stn.id})</h4>
                            <p>${statusText}</p>
                            <div class="card-metrics">${tempTag}${rhTag}${rainTag}${presTag}${windTag}${wdirTag}</div>
                            ${metaHTML}
                        </div>
                    `;
                    issueListContainer.insertAdjacentHTML('beforeend', cardHTML);
                });
            }

            if (autoZoomIfSingle && q && filteredList.length === 1) {
                focusStation(filteredList[0].lat, filteredList[0].lon, filteredList[0].id);
            }
        }

        async function fetchMapData() {
            try {
                const response = await fetch('map_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                allStationsData = await response.json();

                let countNormal = 0;
                let countWarning = 0;
                let countOffline = 0;

                allStationsData.forEach(stn => {
                    const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');
                    if (markerColor === 'green') countNormal++;
                    else if (markerColor === 'yellow') countWarning++;
                    else if (markerColor === 'red') countOffline++;
                });

                document.getElementById('count-normal').textContent = countNormal;
                document.getElementById('count-warning').textContent = countWarning;
                document.getElementById('count-offline').textContent = countOffline;

                renderMapAndSidebar();
                document.getElementById('last-update').innerHTML = `⏰ อัปเดตล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;
            } catch (error) {
                console.error("โหลดข้อมูลไม่สำเร็จ:", error);
            }
        }

        fetchMapData();
        setInterval(fetchMapData, 60000);
    </script>
</body>
</html>
