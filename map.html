<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Monitor Map Dashboard</title>
    <!-- โหลด Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Tahoma', sans-serif; margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .legend {
            position: absolute; bottom: 30px; right: 20px;
            background: white; padding: 15px; border-radius: 8px;
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .legend h4 { margin: 0 0 10px 0; }
        .legend p { margin: 5px 0; font-size: 14px; }
        .update-time { font-size: 12px; color: #666; margin-top: 10px; border-top: 1px solid #ddd; padding-top: 5px;}
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="legend">
        <h4>สถานะสถานีตรวจอากาศ</h4>
        <p>🟢 ทำงานปกติ</p>
        <p>🔴 ขัดข้อง / ขาดการติดต่อ</p>
        <div class="update-time" id="last-update">กำลังเชื่อมต่อข้อมูล...</div>
    </div>

    <!-- โหลด Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ศูนย์กลางแผนที่ภาคใต้ฝั่งตะวันออก
        const map = L.map('map').setView([8.0, 99.5], 7);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        async function fetchMapData() {
            try {
                // เติม ?t= รหัสเวลาเพื่อกันเบราว์เซอร์จำไฟล์เก่า (Cache)
                const response = await fetch('map_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                const stations = await response.json();

                markersLayer.clearLayers();

                stations.forEach(stn => {
                    const markerColor = stn.has_error ? 'red' : 'green';
                    const icon = new L.Icon({
                        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${markerColor}.png`,
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                    });

                    const popupHTML = `<b>${stn.name}</b><br>ID: ${stn.id}<br>สถานะ: ${stn.has_error ? '⚠️ พบปัญหา' : '✅ ปกติ'}`;
                    L.marker([stn.lat, stn.lon], {icon: icon})
                        .bindPopup(popupHTML)
                        .addTo(markersLayer);
                });
                
                document.getElementById('last-update').innerHTML = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;
            } catch (error) {
                console.error("โหลดข้อมูลแผนที่ไม่สำเร็จ:", error);
            }
        }

        // โหลดข้อมูลครั้งแรก และตั้งเวลารีเฟรชอัตโนมัติทุก 1 นาที
        fetchMapData();
        setInterval(fetchMapData, 60000);
    </script>
</body>
</html>
