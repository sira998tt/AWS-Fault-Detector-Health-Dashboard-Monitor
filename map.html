<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Monitor Map Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Tahoma', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #map-container { flex: 7; position: relative; }
        #map { height: 100%; width: 100%; }
        
        .legend {
            position: absolute; bottom: 30px; left: 20px;
            background: white; padding: 15px; border-radius: 8px;
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .legend h4 { margin: 0 0 10px 0; font-size: 16px; }
        .legend p { margin: 5px 0; font-size: 14px; display: flex; align-items: center; }
        
        .color-dot {
            height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px;
        }
        .color-dot.green { background-color: #28a745; }
        .color-dot.yellow { background-color: #ffc107; }
        .color-dot.red { background-color: #dc3545; }
        
        .update-time { font-size: 12px; color: #666; margin-top: 10px; border-top: 1px solid #ddd; padding-top: 5px;}

        #sidebar { 
            flex: 3; 
            background: #f8f9fa; 
            border-left: 1px solid #ccc; 
            padding: 20px; 
            overflow-y: auto; 
        }
        #sidebar h2 { font-size: 18px; margin-top: 0; color: #dc3545; border-bottom: 2px solid #dc3545; padding-bottom: 5px;}
        
        .issue-card {
            background: white;
            border-radius: 5px;
            padding: 10px 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 4px solid #dc3545;
        }
        .issue-card.red { border-left-color: #dc3545; }
        .issue-card.yellow { border-left-color: #ffc107; }
        .issue-card.yellow h4 { color: #856404; }
        
        .issue-card h4 { margin: 0 0 5px 0; font-size: 15px; color: #333;}
        .issue-card p { margin: 0 0 5px 0; font-size: 13px; color: #666; }
        .issue-meta { font-size: 11px; color: #999; display: block; margin-top: 5px; border-top: 1px dashed #eee; padding-top: 5px;}
        .no-issues { text-align: center; color: #28a745; margin-top: 50px; font-weight: bold; }

    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
        <div class="legend">
            <h4>สถานะสถานีตรวจอากาศ</h4>
            <p><span class="color-dot green"></span> ทำงานปกติ</p>
            <p><span class="color-dot yellow"></span> เซ็นเซอร์ขัดข้อง (ข้อมูลหายบางส่วน)</p>
            <p><span class="color-dot red"></span> ขัดข้อง / ขาดการติดต่อ</p>
            <div class="update-time" id="last-update">กำลังเชื่อมต่อข้อมูล...</div>
        </div>
    </div>

    <div id="sidebar">
        <h2>สถานีที่ต้องเฝ้าระวัง</h2>
        <div id="issue-list">
            <p style="text-align: center; color: #666;">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([8.0, 99.5], 7);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        async function fetchMapData() {
            try {
                const response = await fetch('map_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                const stations = await response.json();

                markersLayer.clearLayers();
                const issueListContainer = document.getElementById('issue-list');
                issueListContainer.innerHTML = ""; 
                let hasIssues = false;

                stations.forEach(stn => {
                    const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');
                    
                    const icon = new L.Icon({
                        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${markerColor}.png`,
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                    });

                    let statusText = stn.error_detail;
                    if (!statusText) {
                        statusText = stn.has_error ? 'พบปัญหา' : 'ปกติ';
                    } else {
                         statusText = statusText.replace(/[🔴🟡🟢⚠️✅]/g, '').trim();
                    }

                    const popupHTML = `<b>${stn.name}</b><br>ID: ${stn.id}<br>สถานะ: ${statusText}`;
                    
                    L.marker([stn.lat, stn.lon], {icon: icon})
                        .bindPopup(popupHTML)
                        .addTo(markersLayer);

                    if (stn.has_error) {
                        hasIssues = true;
                        
                        let metaHTML = "";
                        if (stn.issue_time && stn.duration) {
                            metaHTML = `<span class="issue-meta">เริ่มขัดข้อง: ${stn.issue_time} (ผ่านมา ${stn.duration})</span>`;
                        } else if (stn.issue_time) {
                            metaHTML = `<span class="issue-meta">อัปเดตล่าสุด: ${stn.issue_time}</span>`;
                        }

                        const cardHTML = `
                            <div class="issue-card ${markerColor}">
                                <h4>${stn.name} (ID: ${stn.id})</h4>
                                <p>${statusText}</p>
                                ${metaHTML}
                            </div>
                        `;
                        issueListContainer.insertAdjacentHTML('beforeend', cardHTML);
                    }
                });
                
                if (!hasIssues) {
                    issueListContainer.innerHTML = `<div class="no-issues">ทุกสถานีทำงานปกติ</div>`;
                }

                document.getElementById('last-update').innerHTML = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;
            } catch (error) {
                console.error("โหลดข้อมูลไม่สำเร็จ:", error);
            }
        }

        fetchMapData();
        setInterval(fetchMapData, 60000);
    </script>
</body>
</html>
