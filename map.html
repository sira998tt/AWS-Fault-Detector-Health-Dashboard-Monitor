<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TMD South Monitor</title>
    <meta name="theme-color" content="#0d6efd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TMD Monitor">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230d6efd'/%3E%3Ccircle cx='256' cy='256' r='150' fill='none' stroke='%23ffffff' stroke-width='22' stroke-opacity='0.35'/%3E%3Ccircle cx='256' cy='256' r='90' fill='none' stroke='%23ffffff' stroke-width='22' stroke-opacity='0.65'/%3E%3Cpath d='M256 256 L385 160 A160 160 0 0 1 405 290 Z' fill='%232ecc71' opacity='0.85'/%3E%3Ccircle cx='256' cy='256' r='28' fill='%23ffc107'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230d6efd'/%3E%3Ccircle cx='256' cy='256' r='150' fill='none' stroke='%23ffffff' stroke-width='22' stroke-opacity='0.35'/%3E%3Ccircle cx='256' cy='256' r='90' fill='none' stroke='%23ffffff' stroke-width='22' stroke-opacity='0.65'/%3E%3Cpath d='M256 256 L385 160 A160 160 0 0 1 405 290 Z' fill='%232ecc71' opacity='0.85'/%3E%3Ccircle cx='256' cy='256' r='28' fill='%23ffc107'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #333;
            --card-bg: white;
            --sidebar-border: #ccc;
            --meta-color: #777;
            --meta-border: #eee;
            --legend-bg: rgba(255, 255, 255, 0.95);
            --input-bg: #fff;
        }

        body.dark-mode {
            --bg-color: #212529;
            --text-color: #e9ecef;
            --card-bg: #343a40;
            --sidebar-border: #495057;
            --meta-color: #adb5bd;
            --meta-border: #495057;
            --legend-bg: rgba(33, 37, 41, 0.95);
            --input-bg: #2b3035;
        }

        body.dark-mode .base-map-tiles,
        .radar-dark-tiles,
        body.dark-mode .leaflet-control-zoom-in,
        body.dark-mode .leaflet-control-zoom-out,
        body.dark-mode .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(95%);
        }

        body { font-family: 'Tahoma', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; background: var(--bg-color); color: var(--text-color); transition: all 0.3s; }
        
        #map-container { flex: 7; position: relative; height: 100%; }
        #map { height: 100%; width: 100%; }
        
        .legend {
            position: absolute; bottom: 16px; left: 16px;
            background: var(--legend-bg); padding: 15px; border-radius: 8px;
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: var(--text-color);
        }
        .legend h4 { margin: 0 0 10px 0; font-size: 16px; }
        .legend p { margin: 5px 0; font-size: 14px; display: flex; align-items: center; }
        
        .color-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }
        .color-dot.green { background-color: #28a745; }
        .color-dot.yellow { background-color: #ffc107; }
        .color-dot.red { background-color: #dc3545; }
        
        .update-time { font-size: 12px; color: var(--meta-color); margin-top: 10px; border-top: 1px solid var(--meta-border); padding-top: 5px;}

        .theme-toggle {
            position: absolute; top: 20px; right: 20px;
            z-index: 1000; background: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--sidebar-border); padding: 8px 15px;
            border-radius: 20px; cursor: pointer; font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: all 0.3s;
        }
        .theme-toggle:hover { filter: brightness(0.9); }

        .radar-overlay-box {
            position: absolute; top: 20px; left: 55px; z-index: 1000;
            background: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--sidebar-border); padding: 6px 12px;
            border-radius: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            display: flex; align-items: center; gap: 8px;
        }
        .radar-overlay-box select {
            background: transparent; color: var(--text-color); border: none;
            font-family: inherit; font-size: 13px; font-weight: bold; outline: none; cursor: pointer;
        }
        .radar-overlay-box select option {
            background: var(--card-bg); color: var(--text-color);
        }
        
        .leaflet-control-layers {
            margin-top: 60px !important; 
        }

        #sidebar { 
            flex: 3; background: var(--bg-color); border-left: 1px solid var(--sidebar-border); 
            padding: 20px; overflow-y: auto; transition: all 0.3s;
            display: flex; flex-direction: column; box-sizing: border-box;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--sidebar-border);
        }
        .sidebar-header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--text-color);
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .summary-dashboard {
            display: flex; justify-content: space-between; margin-bottom: 15px;
            gap: 8px;
        }
        .stat-card {
            background: var(--card-bg); border-radius: 8px; padding: 10px 6px;
            flex: 1; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 2px solid transparent; cursor: pointer; transition: all 0.2s;
            user-select: none;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card.active-filter { border-color: #0d6efd; box-shadow: 0 0 8px rgba(13,110,253,0.35); }
        .stat-card h5 { margin: 0 0 4px 0; font-size: 12px; color: var(--meta-color); font-weight: normal; }
        .stat-card h2 { margin: 0; font-size: 22px; font-weight: bold; }
        
        .stat-normal h2 { color: #28a745; }
        .stat-warning h2 { color: #ffc107; }
        .stat-offline h2 { color: #dc3545; }

        /* 🔍 ช่องค้นหาและปุ่มตัวกรอง */
        .search-filter-box {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .search-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        #station-search {
            width: 100%;
            padding: 9px 32px 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--sidebar-border);
            background: var(--input-bg);
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        #station-search:focus {
            border-color: #0d6efd;
        }
        .clear-search-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: var(--meta-color);
            cursor: pointer;
            font-size: 16px;
            display: none;
        }
        .filter-pills {
            display: flex;
            gap: 6px;
        }
        .filter-pill {
            flex: 1;
            padding: 5px 6px;
            font-size: 12px;
            border-radius: 15px;
            border: 1px solid var(--sidebar-border);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .filter-pill.active {
            background: #0d6efd;
            color: white;
            border-color: #0d6efd;
            font-weight: bold;
        }
        
        #sidebar h2.title { font-size: 16px; margin: 0 0 10px 0; color: var(--text-color); border-bottom: 2px solid #dc3545; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
        
        .issue-card {
            background: var(--card-bg); border-radius: 6px; padding: 10px 14px;
            margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border-left: 4px solid #dc3545; transition: all 0.2s;
            cursor: pointer;
        }
        .issue-card:hover { transform: translateY(-1px); filter: brightness(0.97); }
        .issue-card.red { border-left-color: #dc3545; }
        .issue-card.yellow { border-left-color: #ffc107; }
        .issue-card.green { border-left-color: #28a745; }
        
        body:not(.dark-mode) .issue-card.yellow h4 { color: #856404; }
        body.dark-mode .issue-card.yellow h4 { color: #ffda6a; }
        
        .issue-card h4 { margin: 0 0 4px 0; font-size: 14px; color: var(--text-color);}
        .issue-card p { margin: 0 0 4px 0; font-size: 13px; color: var(--text-color); opacity: 0.9; line-height: 1.4; }
        .card-metrics { font-size: 12px; color: var(--meta-color); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
        .issue-meta { font-size: 11px; color: var(--meta-color); display: block; margin-top: 5px; border-top: 1px dashed var(--meta-border); padding-top: 5px;}
        .no-issues { text-align: center; color: #28a745; margin-top: 35px; font-weight: bold; }
        
        #issue-list { flex-grow: 1; overflow-y: auto; padding-bottom: 12px; }

        .popup-metrics {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            line-height: 1.5;
        }
        .leaflet-popup-content {
            margin: 10px 12px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* 📱 ปรับแต่งสำหรับหน้าจอมือถือ: ให้ Sidebar ทั้งแผงเลื่อนขึ้นลงได้ ไม่ล็อก Header ตายตัวจนเบียดรายการสถานี */

        /* 📱 แถบเมนูสลับหน้าแบบกะทัดรัด (Compact Non-Overlapping Flex Bar) */
        #aws-view-wrapper {
            display: flex;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            overflow: hidden;
        }
        #radar-view-wrapper {
            display: none;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            background: var(--bg-color);
            overflow: hidden;
        }
        #radar-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: var(--bg-color);
        }
        .app-bottom-nav {
            flex: 0 0 38px;
            height: 38px;
            background: var(--card-bg);
            border-top: 1px solid var(--sidebar-border);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            z-index: 4000;
            box-sizing: border-box;
        }
        .app-nav-btn {
            height: 28px;
            padding: 0 16px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: transparent;
            color: var(--meta-color);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: bold;
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .app-nav-btn:hover {
            background: rgba(13, 110, 253, 0.08);
        }
        .app-nav-btn .nav-icon {
            font-size: 14px;
            line-height: 1;
        }
        .app-nav-btn.active {
            background: #0d6efd;
            color: #ffffff !important;
            box-shadow: 0 2px 6px rgba(13, 110, 253, 0.35);
        }
        .install-pwa-btn {
            display: none;
            background: #198754;
            color: #fff !important;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 11.5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100dvh;
            }
            #aws-view-wrapper {
                flex-direction: column;
            }
            #map-container {
                flex: none;
                height: 46%;
                width: 100%;
            }
            #sidebar {
                flex: none;
                height: 54%;
                width: 100%;
                border-left: none;
                border-top: 2px solid var(--sidebar-border);
                padding: 10px 12px 24px 12px;
                display: block; /* 📌 ให้เนื้อหาทั้งหมดในครึ่งล่างเลื่อนขึ้นลงพร้อมกันได้ จะได้เห็นการ์ดสถานีเต็มจอ */
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            #issue-list {
                overflow-y: visible;
                height: auto;
            }
            .sidebar-header {
                display: none; /* 📌 ซ่อนชื่อหัวข้อใหญ่บนมือถือเพื่อคืนพื้นที่ให้รายการสถานี */
            }
            .summary-dashboard {
                margin-bottom: 8px;
                gap: 6px;
            }
            .stat-card {
                padding: 5px 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }
            .stat-card h5 {
                font-size: 12px;
                margin: 0;
            }
            .stat-card h2 {
                font-size: 16px;
                margin: 0;
            }
            .search-filter-box {
                margin-bottom: 10px;
                gap: 6px;
            }
            #station-search {
                padding: 7px 30px 7px 10px;
                font-size: 13px;
            }
            .filter-pill {
                padding: 5px 4px;
                font-size: 11px;
            }
            #sidebar h2.title {
                font-size: 14px;
                margin-bottom: 8px;
                position: sticky;
                top: -10px;
                background: var(--bg-color);
                z-index: 10;
                padding: 6px 0;
            }
            .issue-card {
                padding: 9px 11px;
                margin-bottom: 8px;
            }
            .issue-card h4 {
                font-size: 13.5px;
            }
            .issue-card p {
                font-size: 12.5px;
            }
            .legend {
                bottom: 8px;
                left: 8px;
                padding: 6px 8px;
                max-width: 165px;
                background: var(--legend-bg);
                opacity: 0.9;
            }
            .legend h4 {
                display: none;
            }
            .legend p {
                font-size: 10.5px;
                margin: 2px 0;
            }
            .color-dot {
                height: 9px;
                width: 9px;
                margin-right: 5px;
            }
            .update-time {
                font-size: 9.5px;
                margin-top: 3px;
                padding-top: 3px;
            }
            .theme-toggle {
                top: 8px;
                right: 8px;
                padding: 5px 10px;
                font-size: 11px;
            }
            .radar-overlay-box {
                top: 8px;
                left: 48px;
                padding: 4px 8px;
                gap: 5px;
            }
            .radar-overlay-box select {
                font-size: 11px;
                max-width: 145px;
            }
            .leaflet-control-layers {
                margin-top: 42px !important;
            }
            .leaflet-popup-content {
                font-size: 12px;
                margin: 8px 10px;
            }
            .popup-metrics {
                font-size: 11.5px;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body style="flex-direction: column;">
    <div id="aws-view-wrapper">
    <div id="map-container">
        <div id="map"></div>
        <div class="radar-overlay-box" id="radar-ctrl-box">
            <select id="radar-overlay-select" onchange="onRadarOverlayChange()">
                <option value="OFF">🚫 ปิดภาพเรดาร์</option>
                <option value="ALL">🌧️ เรดาร์กรมอุตุฯ รวม 5 สถานี (HQ)</option>
                <option value="RAINVIEWER">🌐 เรดาร์ทั่วไทย (RainViewer API)</option>
                <option value="CMP_HQ">📡 เรดาร์ชุมพร (HQ)</option>
                <option value="SRT_HQ">📡 เรดาร์สุราษฎร์ฯ (HQ)</option>
                <option value="STP_HQ">📡 เรดาร์สทิงพระ (HQ)</option>
                <option value="HYI_HQ">📡 เรดาร์หาดใหญ่ (HQ)</option>
                <option value="NRT_HQ">📡 เรดาร์นราธิวาส (HQ)</option>
            </select>
            <input type="range" id="radar-opacity" min="20" max="95" value="70" title="ปรับความโปร่งใสเรดาร์" oninput="onRadarOpacityChange(this.value)" style="display:none; width:70px; accent-color:#0d6efd; cursor:pointer;" />
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 โหมดมืด</button>
        <div class="legend">
            <h4>สถานะสถานีตรวจอากาศ</h4>
            <p><span class="color-dot green"></span> ปกติ</p>
            <p><span class="color-dot yellow"></span> เซ็นเซอร์ผิดปกติ</p>
            <p><span class="color-dot red"></span> ขาดการติดต่อ</p>
            <div class="update-time" id="last-update">กำลังเชื่อมต่อ...</div>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Smart AWS Monitor</h1>
        </div>

        <div class="summary-dashboard">
            <div class="stat-card stat-normal" id="card-filter-green" onclick="setStatusFilter('green')" title="คลิกเพื่อกรองเฉพาะสถานีปกติ">
                <h5>🟢 ปกติ</h5>
                <h2 id="count-normal">-</h2>
            </div>
            <div class="stat-card stat-warning" id="card-filter-yellow" onclick="setStatusFilter('yellow')" title="คลิกเพื่อกรองเฉพาะสถานีเซ็นเซอร์ผิดปกติ">
                <h5>⚠️ มีปัญหา</h5>
                <h2 id="count-warning">-</h2>
            </div>
            <div class="stat-card stat-offline" id="card-filter-red" onclick="setStatusFilter('red')" title="คลิกเพื่อกรองเฉพาะสถานีออฟไลน์">
                <h5>🔴 ออฟไลน์</h5>
                <h2 id="count-offline">-</h2>
            </div>
        </div>

        <!-- 🔍 ช่องค้นหาชื่อ/รหัสสถานี และปุ่มตัวกรอง -->
        <div class="search-filter-box">
            <div class="search-input-wrap">
                <input type="text" id="station-search" placeholder="🔍 ค้นหาชื่อสถานี หรือ รหัส ID..." oninput="onSearchInput()" onkeydown="onSearchKeydown(event)" />
                <button class="clear-search-btn" id="clear-search" onclick="clearSearch()" title="ล้างคำค้นหา">✕</button>
            </div>
            <div class="filter-pills">
                <button class="filter-pill active" id="pill-issues" onclick="setStatusFilter('issues')">⚠️ เฝ้าระวัง</button>
                <button class="filter-pill" id="pill-all" onclick="setStatusFilter('all')">📍 ทั้งหมด</button>
                <button class="filter-pill" id="pill-green" onclick="setStatusFilter('green')">🟢 ปกติ</button>
                <button class="filter-pill" id="pill-yellow" onclick="setStatusFilter('yellow')">🟡 เซ็นเซอร์</button>
                <button class="filter-pill" id="pill-red" onclick="setStatusFilter('red')">🔴 ออฟไลน์</button>
            </div>
        </div>
        
        <h2 class="title">
            <span id="list-heading-text">⚠️ สถานีที่ต้องเฝ้าระวัง</span>
            <small id="list-count-badge" style="font-size: 12px; color: var(--meta-color); font-weight: normal;"></small>
        </h2>
        <div id="issue-list">
            <p style="text-align: center; color: var(--meta-color);">กำลังโหลดข้อมูล...</p>
        </div>
    </div>
    </div><!-- end #aws-view-wrapper -->

    <!-- 📡 หน้าต่างที่ 2: ระบบติดตามสถานะเรดาร์และดูภาพย้อนหลัง (Radar Dashboard) -->
    <div id="radar-view-wrapper">
        <iframe id="radar-iframe" data-src="https://sira998tt.github.io/radar-dashboard/" title="TMD Radar Monitor"></iframe>
    </div>

    <!-- 📱 แถบเมนูสลับหน้าแอปด้านล่าง (Unified App Bottom Navigation) -->
    <nav class="app-bottom-nav">
        <button class="app-nav-btn active" id="nav-tab-aws" onclick="switchAppTab('aws')">
            <span class="nav-icon">📍</span>
            <span>สถานีตรวจอากาศ (AWS)</span>
        </button>
        <button class="app-nav-btn" id="nav-tab-radar" onclick="switchAppTab('radar')">
            <span class="nav-icon">📡</span>
            <span>สถานะเรดาร์ & ย้อนหลัง</span>
        </button>
        <button class="install-pwa-btn" id="install-pwa-btn" onclick="installPWA()">📲 ติดตั้งแอป</button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. แผนที่ถนนคมชัดสูง (Google Streets - ตัวหนังสือภาษาไทยคมกริบ ไม่ต้องใช้ API Key)
        const hdStreetMap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=th', {
            attribution: '&copy; Google Maps',
            maxZoom: 20
        });

        // 2. แผนที่โหมดมืดคมชัด (ใช้ Google Streets กลับสีเฉพาะแผ่นแผนที่ ไม่กลับสีเรดาร์)
        const hdDarkMap = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=th', {
            attribution: '&copy; Google Maps',
            className: 'radar-dark-tiles',
            maxZoom: 20
        });

        // 3. แผนที่มาตรฐาน OpenStreetMap
        const osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            className: 'base-map-tiles',
            maxNativeZoom: 18,
            maxZoom: 19
        });

        // 4. ภาพถ่ายดาวเทียมพร้อมชื่อสถานที่ (ซูมลึกได้ชัด ไม่ขึ้นจอเทา)
        const satelliteMap = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}&hl=th', {
            attribution: '&copy; Google Hybrid',
            maxZoom: 20
        });

        // 5. แผนที่ภูมิประเทศและแนวเทือกเขาความละเอียดสูง (Google Terrain ภาษาไทย)
        const googleTerrainMap = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}&hl=th', {
            attribution: '&copy; Google Terrain',
            maxZoom: 20
        });

        // 6. แผนที่เส้นชั้นความสูง (OpenTopoMap)
        const topoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenTopoMap',
            maxNativeZoom: 16,
            maxZoom: 19
        });

        const initialIsDark = localStorage.getItem('theme') === 'dark';
        if (initialIsDark) {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').innerHTML = '☀️ โหมดสว่าง';
        }

        const map = L.map('map', {
            center: [8.0, 99.5],
            zoom: 7,
            layers: [initialIsDark ? hdDarkMap : hdStreetMap]
        });

        const baseMaps = {
            "✨ แผนที่คมชัดสูง (HD)": hdStreetMap,
            "🌑 แผนที่มืดแท้ (Radar Dark)": hdDarkMap,
            "⛰️ ภูมิประเทศ + เทือกเขา (HD)": googleTerrainMap,
            "🧭 เส้นชั้นความสูง (Topo)": topoMap,
            "🛰️ ดาวเทียม + ชื่อสถานที่": satelliteMap,
            "🗺️ OpenStreetMap ปกติ": osmMap
        };
        L.control.layers(baseMaps).addTo(map);

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.querySelector('.theme-toggle').innerHTML = isDark ? '☀️ โหมดสว่าง' : '🌙 โหมดมืด';

            // สลับระหว่างแผนที่ HD สว่าง กับ Radar Dark @2x อัตโนมัติ (หากไม่ได้เปิดดาวเทียม/ภูมิประเทศค้างไว้)
            if (isDark && map.hasLayer(hdStreetMap)) {
                map.removeLayer(hdStreetMap);
                hdDarkMap.addTo(map);
            } else if (!isDark && map.hasLayer(hdDarkMap)) {
                map.removeLayer(hdDarkMap);
                hdStreetMap.addTo(map);
            }
        }

        let radarLayerGroup = L.layerGroup().addTo(map);
        let markersLayer = L.layerGroup().addTo(map);
        let stationMarkers = {};
        let allStationsData = [];
        let currentFilter = 'issues';
        let radarTunnelUrl = "";
        let radarOpacity = 0.70;

        const RADAR_BOUNDS_SPECS = {
            "CMP_HQ": { lat: 10.490, lon: 99.178 },
            "SRT_HQ": { lat: 9.131,  lon: 99.144 },
            "STP_HQ": { lat: 7.472,  lon: 100.435 },
            "HYI_HQ": { lat: 6.927,  lon: 100.432 },
            "NRT_HQ": { lat: 6.416,  lon: 101.805 }
        };

        function getRadarBounds(lat, lon) {
            const dLat = 240.0 / 110.574;
            const dLon = 240.0 / (111.320 * Math.cos(lat * Math.PI / 180.0));
            return [[lat - dLat, lon - dLon], [lat + dLat, lon + dLon]];
        }

        async function syncRadarTunnelUrl() {
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                radarTunnelUrl = `http://${location.hostname}:8080`;
                return;
            }
            let candidates = [];
            try {
                const res = await fetch('https://raw.githubusercontent.com/sira998tt/radar-dashboard/main/data.json?t=' + Date.now(), { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.archive_base_url) candidates.push(data.archive_base_url.replace(/\/$/, ''));
                }
            } catch (e) {}
            if (allStationsData.length > 0 && allStationsData[0].radar_tunnel_url) {
                const u = allStationsData[0].radar_tunnel_url.replace(/\/$/, '');
                if (u && !candidates.includes(u)) candidates.push(u);
            }
            for (const cand of candidates) {
                try {
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 4000);
                    const r = await fetch(`${cand}/api/status?t=${Date.now()}`, { signal: ctrl.signal, cache: 'no-store' });
                    clearTimeout(tid);
                    if (r.ok) {
                        radarTunnelUrl = cand;
                        return;
                    }
                } catch (e) {}
            }
            if (candidates.length > 0) radarTunnelUrl = candidates[0];
        }

        async function onRadarOverlayChange() {
            radarLayerGroup.clearLayers();
            const mode = document.getElementById('radar-overlay-select').value;
            const slider = document.getElementById('radar-opacity');
            if (mode === 'OFF') {
                slider.style.display = 'none';
                return;
            }
            slider.style.display = 'inline-block';

            // 🌐 กรณีเลือก RainViewer API (ดึง Tile เรดาร์ไร้รอยต่อทั่วไทยโดยตรง)
            if (mode === 'RAINVIEWER') {
                try {
                    const rvRes = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                    if (rvRes.ok) {
                        const rvData = await rvRes.json();
                        const pastList = (rvData.radar && rvData.radar.past) ? rvData.radar.past : [];
                        if (pastList.length > 0) {
                            const latestPath = pastList[pastList.length - 1].path;
                            const rvHost = rvData.host || 'https://tilecache.rainviewer.com';
                            L.tileLayer(`${rvHost}${latestPath}/256/{z}/{x}/{y}/2/1_1.png`, {
                                opacity: radarOpacity,
                                maxNativeZoom: 7,
                                maxZoom: 19,
                                interactive: false,
                                attribution: 'RainViewer'
                            }).addTo(radarLayerGroup);
                        }
                    }
                } catch (e) {
                    console.error("RainViewer error:", e);
                }
                return;
            }

            // 📡 กรณีเลือกเรดาร์กรมอุตุนิยมวิทยา (HQ 240 km) จากเซิร์ฟเวอร์ของเรา
            if (!radarTunnelUrl) await syncRadarTunnelUrl();
            if (!radarTunnelUrl) return;

            const targets = (mode === 'ALL') ? Object.keys(RADAR_BOUNDS_SPECS) : [mode];
            const cacheBuster = Math.floor(Date.now() / 60000);
            targets.forEach(code => {
                const spec = RADAR_BOUNDS_SPECS[code];
                if (!spec) return;
                const bounds = getRadarBounds(spec.lat, spec.lon);
                const imgUrl = `${radarTunnelUrl}/api/overlay?station=${code}&v=4&t=${cacheBuster}`;
                L.imageOverlay(imgUrl, bounds, { opacity: radarOpacity, interactive: false }).addTo(radarLayerGroup);
            });
        }

        function onRadarOpacityChange(val) {
            radarOpacity = Number(val) / 100.0;
            radarLayerGroup.eachLayer(layer => {
                if (layer.setOpacity) layer.setOpacity(radarOpacity);
            });
        }

        setInterval(() => {
            const sel = document.getElementById('radar-overlay-select');
            if (sel && sel.value !== 'OFF') {
                onRadarOverlayChange();
            }
        }, 180000);

        function isMobileView() {
            return window.innerWidth <= 768;
        }

        function focusStation(lat, lon, id) {
            // บนมือถือ เลื่อนจุดศูนย์กลางแผนที่ลงเล็กน้อยเพื่อให้กล่อง Popup ที่เด้งด้านบนไม่ชนขอบจอ
            const targetLat = isMobileView() ? (lat + 0.06) : lat;
            map.flyTo([targetLat, lon], 11, { duration: 0.8 });
            if (stationMarkers[id]) {
                stationMarkers[id].openPopup();
            }
        }

        function setStatusFilter(filterType) {
            if (currentFilter === filterType && filterType !== 'issues') {
                currentFilter = 'issues';
            } else {
                currentFilter = filterType;
            }
            updateFilterUI();
            renderMapAndSidebar();
        }

        function updateFilterUI() {
            ['issues', 'all', 'green', 'yellow', 'red'].forEach(k => {
                const pill = document.getElementById('pill-' + k);
                if (pill) pill.classList.toggle('active', currentFilter === k);
            });
            ['green', 'yellow', 'red'].forEach(k => {
                const card = document.getElementById('card-filter-' + k);
                if (card) card.classList.toggle('active-filter', currentFilter === k);
            });

            const headingMap = {
                'issues': '⚠️ สถานีที่ต้องเฝ้าระวัง',
                'all': '📍 สถานีทั้งหมด',
                'green': '🟢 สถานีทำงานปกติ',
                'yellow': '🟡 สถานีเซ็นเซอร์ผิดปกติ',
                'red': '🔴 สถานีขาดการติดต่อ (Offline)'
            };
            document.getElementById('list-heading-text').textContent = headingMap[currentFilter] || 'รายการสถานี';
        }

        function onSearchInput() {
            const q = document.getElementById('station-search').value.trim();
            document.getElementById('clear-search').style.display = q ? 'block' : 'none';
            renderMapAndSidebar(true);
        }

        function onSearchKeydown(e) {
            if (e.key === 'Enter') {
                const matched = getFilteredStations();
                if (matched.length > 0) {
                    focusStation(matched[0].lat, matched[0].lon, matched[0].id);
                }
            }
        }

        function clearSearch() {
            document.getElementById('station-search').value = '';
            document.getElementById('clear-search').style.display = 'none';
            renderMapAndSidebar();
        }

        function formatLiveDuration(stn) {
            if (!stn.issue_start_iso) return stn.duration || '';
            const startMs = Date.parse(stn.issue_start_iso);
            if (isNaN(startMs)) return stn.duration || '';
            const diffMins = Math.max(0, Math.floor((Date.now() - startMs) / 60000));
            if (diffMins >= 1440) {
                return `${Math.floor(diffMins / 1440)} วัน ${Math.floor((diffMins % 1440) / 60)} ชม.`;
            } else if (diffMins >= 60) {
                return `${Math.floor(diffMins / 60)} ชม. ${diffMins % 60} นาที`;
            }
            return `${diffMins} นาที`;
        }

        function matchesSearchQuery(stn, q) {
            if (!q) return true;
            const idStr = String(stn.id).trim().toLowerCase();
            const nameStr = String(stn.name).toLowerCase();
            if (/^\d+$/.test(q)) {
                return idStr === q;
            }
            return nameStr.includes(q) || idStr === q;
        }

        function matchesStatusFilter(stn) {
            const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');
            if (currentFilter === 'issues') return Boolean(stn.has_error);
            if (currentFilter === 'all') return true;
            return markerColor === currentFilter;
        }

        function getFilteredStations() {
            const q = document.getElementById('station-search').value.trim().toLowerCase();
            return allStationsData.filter(stn => {
                return matchesSearchQuery(stn, q) && matchesStatusFilter(stn);
            });
        }

        function renderMapAndSidebar(autoZoomIfSingle = false) {
            markersLayer.clearLayers();
            stationMarkers = {};
            const issueListContainer = document.getElementById('issue-list');
            issueListContainer.innerHTML = "";

            const q = document.getElementById('station-search').value.trim().toLowerCase();
            const filteredList = getFilteredStations();
            const popupMaxW = isMobileView() ? 245 : 320;

            filteredList.forEach(stn => {
                const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');

                const icon = new L.Icon({
                    iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${markerColor}.png`,
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                });

                let statusText = stn.error_detail;
                if (!statusText) {
                    statusText = stn.has_error ? '⚠️ พบปัญหา' : '✅ ปกติ';
                } else if (markerColor === 'yellow') {
                    statusText = "⚠️ " + statusText.replace(/[🔴🟡🟢⚠️✅]/g, '').trim();
                } else if (markerColor === 'red') {
                    statusText = "🔴 " + statusText.replace(/[🔴🟡🟢⚠️✅]/g, '').trim();
                }

                function degToCompass(deg) {
                    if (deg === null || deg === undefined || isNaN(deg)) return '';
                    const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
                    return dirs[Math.round(((deg % 360) / 22.5)) % 16];
                }

                const tempStr = (stn.temp !== null && stn.temp !== undefined) ? `${stn.temp} °C` : '-';
                const rainStr = (stn.rain !== null && stn.rain !== undefined) ? `${stn.rain} mm` : '-';
                const rhStr = (stn.rh !== null && stn.rh !== undefined) ? `${stn.rh} %` : '-';
                const windStr = (stn.wind !== null && stn.wind !== undefined) ? `${stn.wind} knot` : '-';
                const wdirCompass = degToCompass(stn.wind_dir);
                const wdirStr = (stn.wind_dir !== null && stn.wind_dir !== undefined) ? `${stn.wind_dir}° ${wdirCompass ? '(' + wdirCompass + ')' : ''}`.trim() : '-';
                const presStr = (stn.pressure !== null && stn.pressure !== undefined) ? `${stn.pressure} hPa` : '-';
                // 📌 ซ่อนทัศนวิสัยที่เป็น 0 m (แสดงเฉพาะสถานีที่มีค่า > 0 เท่านั้น)
                const visLine = (stn.vis !== null && stn.vis !== undefined && Number(stn.vis) > 0) ? `<br>👁 <b>ทัศนวิสัย:</b> ${stn.vis} m` : '';
                const timeStr = stn.updated_at ? `<br><small style="color:#777;">🕒 ข้อมูลเวลา: ${stn.updated_at}</small>` : '';

                const popupHTML = `
                    <b>${stn.name}</b> (ID: ${stn.id})<br>
                    สถานะ: ${statusText}
                    <div class="popup-metrics">
                        🌡 <b>อุณหภูมิ:</b> ${tempStr} &nbsp;|&nbsp; 💧 <b>ความชื้น:</b> ${rhStr}<br>
                        🌧 <b>ฝนสะสม:</b> ${rainStr} &nbsp;|&nbsp; 🧭 <b>ความกด:</b> ${presStr}<br>
                        💨 <b>ความเร็วลม:</b> ${windStr} &nbsp;|&nbsp; 🚩 <b>ทิศลม:</b> ${wdirStr}${visLine}
                        ${timeStr}
                    </div>
                `;

                const marker = L.marker([stn.lat, stn.lon], {icon: icon})
                    .bindPopup(popupHTML, { maxWidth: popupMaxW, autoPanPadding: [20, 20] })
                    .addTo(markersLayer);
                stationMarkers[stn.id] = marker;
            });

            document.getElementById('list-count-badge').textContent = `(${filteredList.length} สถานี)`;

            if (filteredList.length === 0) {
                if (!q && currentFilter === 'issues') {
                    issueListContainer.innerHTML = `<div class="no-issues">✨ ทุกสถานีทำงานปกติ</div>`;
                } else {
                    issueListContainer.innerHTML = `<p style="text-align:center; color:var(--meta-color); margin-top:30px;">ไม่พบสถานีที่ตรงกับเงื่อนไข</p>`;
                }
            } else {
                filteredList.forEach(stn => {
                    const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');
                    let statusText = stn.error_detail || (stn.has_error ? '⚠️ พบปัญหา' : '✅ ปกติ');
                    const liveDur = formatLiveDuration(stn);

                    let metaHTML = "";
                    if (stn.has_error && stn.issue_time && liveDur) {
                        metaHTML = `<span class="issue-meta">⏰ เริ่มขัดข้อง: ${stn.issue_time} (ผ่านมา ${liveDur})</span>`;
                    } else if (stn.updated_at) {
                        metaHTML = `<span class="issue-meta">🕒 อัปเดตข้อมูลล่าสุด: ${stn.updated_at}</span>`;
                    }

                    const tempTag = (stn.temp !== null && stn.temp !== undefined) ? `<span>🌡 ${stn.temp}°C</span>` : '';
                    const rhTag = (stn.rh !== null && stn.rh !== undefined) ? `<span>💧 ${stn.rh}%</span>` : '';
                    const rainTag = (stn.rain !== null && stn.rain !== undefined) ? `<span>🌧 ${stn.rain} mm</span>` : '';
                    const presTag = (stn.pressure !== null && stn.pressure !== undefined) ? `<span>🧭 ${stn.pressure} hPa</span>` : '';
                    const windTag = (stn.wind !== null && stn.wind !== undefined) ? `<span>💨 ${stn.wind} kt</span>` : '';
                    const wdirTag = (stn.wind_dir !== null && stn.wind_dir !== undefined) ? `<span>🚩 ${stn.wind_dir}°</span>` : '';

                    const cardHTML = `
                        <div class="issue-card ${markerColor}" onclick="focusStation(${stn.lat}, ${stn.lon}, '${stn.id}')">
                            <h4>${stn.name} (ID: ${stn.id})</h4>
                            <p>${statusText}</p>
                            <div class="card-metrics">${tempTag}${rhTag}${rainTag}${presTag}${windTag}${wdirTag}</div>
                            ${metaHTML}
                        </div>
                    `;
                    issueListContainer.insertAdjacentHTML('beforeend', cardHTML);
                });
            }

            if (autoZoomIfSingle && q && filteredList.length === 1) {
                focusStation(filteredList[0].lat, filteredList[0].lon, filteredList[0].id);
            }
        }

        async function fetchMapData() {
            try {
                const response = await fetch('map_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                allStationsData = await response.json();

                let countNormal = 0;
                let countWarning = 0;
                let countOffline = 0;

                allStationsData.forEach(stn => {
                    const markerColor = stn.marker_status || (stn.has_error ? 'red' : 'green');
                    if (markerColor === 'green') countNormal++;
                    else if (markerColor === 'yellow') countWarning++;
                    else if (markerColor === 'red') countOffline++;
                });

                document.getElementById('count-normal').textContent = countNormal;
                document.getElementById('count-warning').textContent = countWarning;
                document.getElementById('count-offline').textContent = countOffline;

                renderMapAndSidebar();
                document.getElementById('last-update').innerHTML = `⏰ อัปเดต: ${new Date().toLocaleTimeString('th-TH')}`;
            } catch (error) {
                console.error("โหลดข้อมูลไม่สำเร็จ:", error);
            }
        }


        // 📱 ฟังก์ชันสลับแท็บระหว่าง AWS Monitor และ Radar Monitor ภายในแอปเดียว
        function switchAppTab(tabName) {
            const awsWrap = document.getElementById('aws-view-wrapper');
            const radarWrap = document.getElementById('radar-view-wrapper');
            const btnAws = document.getElementById('nav-tab-aws');
            const btnRadar = document.getElementById('nav-tab-radar');
            const radarIframe = document.getElementById('radar-iframe');

            if (tabName === 'radar') {
                awsWrap.style.display = 'none';
                radarWrap.style.display = 'block';
                btnAws.classList.remove('active');
                btnRadar.classList.add('active');
                if (!radarIframe.getAttribute('src')) {
                    radarIframe.setAttribute('src', radarIframe.getAttribute('data-src'));
                }
            } else {
                radarWrap.style.display = 'none';
                awsWrap.style.display = 'flex';
                btnRadar.classList.remove('active');
                btnAws.classList.add('active');
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        // 📲 ระบบรองรับการติดตั้งเป็น Web App (PWA) ลงหน้าจอมือถือ
        let deferredPrompt = null;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('install-pwa-btn');
            if (btn) btn.style.display = 'inline-block';
        });
        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                document.getElementById('install-pwa-btn').style.display = 'none';
            }
            deferredPrompt = null;
        }

        fetchMapData();
        setInterval(fetchMapData, 60000);
    </script>
</body>
</html>
