<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Monitor Dashboard</title>
    <!-- โหลด Leaflet CSS สำหรับแผนที่ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Tahoma', sans-serif; margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .legend h4 { margin: 0 0 10px 0; }
        .legend p { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- ป้ายอธิบายสัญลักษณ์ -->
    <div class="legend">
        <h4>สถานะสถานี AWS</h4>
        <p>🟢 ทำงานปกติ</p>
        <p>🔴 ขัดข้อง / ขาดการติดต่อ</p>
    </div>

    <!-- โหลด Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. ตั้งค่าเริ่มต้นแผนที่ (พิกัดศูนย์กลางภาคใต้ฝั่งตะวันออก)
        const map = L.map('map').setView([8.0, 99.5], 7);
        
        // 2. ดึงลายแผนที่ฟรีจาก OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // ตัวแปรเก็บหมุดทั้งหมดบนแผนที่
        let markersLayer = L.layerGroup().addTo(map);

        // 3. ฟังก์ชันดึงข้อมูลพิกัดและสถานะจาก Backend
        async function fetchAndRenderMap() {
            try {
                // ⚠️ เปลี่ยน URL นี้เป็นลิงก์ Firebase Database ของคุณ
                const response = await fetch('https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com/aws_map.json');
                const stations = await response.json();

                // เคลียร์หมุดเก่าออกก่อนวาดใหม่
                markersLayer.clearLayers();

                if (stations) {
                    stations.forEach(stn => {
                        if (stn.lat && stn.lon) {
                            // เลือกสีหมุดตามสถานะ (มีปัญหา = แดง, ปกติ = เขียว)
                            const markerColor = stn.has_error ? 'red' : 'green';
                            const icon = new L.Icon({
                                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${markerColor}.png`,
                                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                                iconSize: [25, 41],
                                iconAnchor: [12, 41],
                                popupAnchor: [1, -34],
                                shadowSize: [41, 41]
                            });

                            // ปักหมุดและสร้าง Popup เมื่อกดคลิก
                            const popupHTML = `<b>${stn.name}</b><br>ID: ${stn.id}<br>สถานะ: ${stn.has_error ? '⚠️ พบปัญหา' : '✅ ปกติ'}`;
                            L.marker([stn.lat, stn.lon], {icon: icon})
                                .bindPopup(popupHTML)
                                .addTo(markersLayer);
                        }
                    });
                }
            } catch (error) {
                console.error("โหลดข้อมูลแผนที่ไม่สำเร็จ:", error);
            }
        }

        // ดึงข้อมูลครั้งแรกเมื่อโหลดหน้าเว็บ
        fetchAndRenderMap();
        
        // ตั้งเวลารีเฟรชข้อมูลอัตโนมัติทุกๆ 1 นาที (60000 ms)
        setInterval(fetchAndRenderMap, 60000);
    </script>
</body>
</html>
